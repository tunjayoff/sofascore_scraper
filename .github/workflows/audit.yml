name: Audit

# Known-vulnerability check of the pinned Python packages (constraints.txt) and the frontend
# lockfile. Runs when either changes, and weekly so that an advisory published against an
# unchanged pin still shows up. Kept out of ci.yml: an advisory against an untouched dependency
# should not turn an unrelated pull request (or a release) red.

on:
  pull_request:
    paths:
      - "requirements*.txt"
      - "constraints.txt"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/audit.yml"
  push:
    branches: [main]
    paths:
      - "requirements*.txt"
      - "constraints.txt"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "41 4 * * 1" # Mondays 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  pip-audit:
    name: pip-audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # constraints.txt pins different pandas/numpy versions for Python 3.10; audit both sets
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pip-audit
      # Audits exactly the pins that apply to this Python version, without installing them
      - run: pip-audit --requirement constraints.txt --no-deps --disable-pip

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Packages shipped to the browser: any advisory fails
      - name: Runtime dependencies
        run: npm audit --omit=dev
      # Build and test tooling: only high and critical advisories fail
      - name: All dependencies
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
