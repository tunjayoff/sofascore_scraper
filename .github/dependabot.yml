# Dependabot: weekly update pull requests, grouped so that a normal week is at most one pull
# request per ecosystem. Every pull request runs CI with the proposed versions.
version: 2

updates:
  # constraints.txt (exact pins) and requirements*.txt (allowed ranges)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    # Move the pins; touch a range in requirements.txt only when the new version is outside it
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # pydantic pins pydantic-core exactly (2.13.5 -> pydantic-core==2.46.5) and pydantic-core is
      # released ahead of pydantic. Dependabot does not resolve requirements/constraints files
      # against each other, so it kept proposing pydantic-core alone, which cannot install.
      # pydantic-core therefore never gets a pull request of its own; in a "pydantic" pull
      # request, set pydantic-core in constraints.txt to the version the new pydantic pins.
      - dependency-name: "pydantic-core"
    groups:
      # pydantic on its own, so the hand edit above does not hold back the other updates
      pydantic:
        patterns:
          - "pydantic"
        update-types:
          - minor
          - patch
      # The Turnstile solve was verified live with exactly these versions. CI only exercises
      # them against a local fake site, so before merging this group run:
      #   python -m pytest -m "live and browser" tests/test_live_bridge.py
      browser-stack:
        patterns:
          - "scrapling"
          - "patchright"
          - "playwright"
      python-minor-patch:
        update-types:
          - minor
          - patch
      # Major versions arrive as individual pull requests

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # TypeScript 7 (the native compiler) no longer ships the JavaScript compiler API that vue-tsc
      # and typescript-eslint load (vue-tsc: "./lib/tsc is not exported"; typescript-eslint 8.71
      # peer range ">=4.8.4 <6.1.0"). Remove this once both support it (#142).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
