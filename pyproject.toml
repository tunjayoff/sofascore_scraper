[project]
name = "sofascore-scraper"
version = "3.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",  # fastapi.testclient
    "ruff>=0.6",
]
# Parquet dışa aktarması (sofascore_scraper/store/export.py, Exporter.rows). İsteğe bağlı: yoksa yalnızca Parquet biçimi
# kullanılamaz ve paketi adıyla anan bir hata verir. Kurulum: pip install -e ".[parquet]"
parquet = [
    # 16: numpy 2 ile çalışan en eski sürüm (15 numpy<2 ister, 14 numpy 2 ile içe aktarılamaz; CI'ın Parquet işi)
    "pyarrow>=16",
]

# Yeni CLI (sofascore_scraper/cli; docs/design/02-services.md bölüm 4). Kurulum gerektirmeden: python -m sofascore_scraper.cli.main
# `ssc` komutu için proje düzenlenebilir kipte kurulur: pip install -e .  (bağımlılıklar yine
# requirements.txt + constraints.txt ile kurulur). Düzenlenebilir olmayan kurulum desteklenmez: sürüm
# (pyproject.toml), çeviriler (locales/) ve web arayüzü (frontend/dist) proje klasöründen okunur.
[project.scripts]
ssc = "sofascore_scraper.cli.main:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sofascore_scraper", "sofascore_scraper.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: gerçek SofaScore API'sine istek atar (ağ gerekir)",
    "browser: Playwright/Chrome başlatır",
]
addopts = "-m 'not live and not browser'"
# starlette 1.7 asks for `httpx2` under TestClient (it imports `httpx2 as httpx`, with httpx as a deprecated
# fallback). Not switched in FX-15: httpx2 could not be installed and verified offline, and its version would have
# to be pinned in constraints.txt without a run. The tests keep httpx (requirements-dev.txt); switch when a run
# with httpx2 has passed, then drop this filter.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

# Kapsam `pytest --cov` ile ölçülür (CI: Linux / Python 3.14 işi); satır + dal kapsamı birlikte.
# main.py ve scripts/ ölçüme dahil değildir.
[tool.coverage.run]
source = ["sofascore_scraper"]
branch = true

[tool.coverage.report]
# The floor sits about five points below the measured value (about 90 % on 2026-10-02). The margin covers
# the differences between runs and the planned changes that delete code together with its tests.
# When the measured value rises for good, raise the floor with it.
fail_under = 85
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["frontend", "data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# B007 (kullanılmayan döngü değişkeni) ve B904 (except içinde from olmadan raise) kod tabanına
# yayılmış stil konuları; gerçek hata yakalayan kurallar açık kalır.
ignore = ["E501", "E402", "B007", "B904"]
