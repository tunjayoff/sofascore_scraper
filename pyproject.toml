[project]
name = "sofascore-scraper"
version = "2.0.0"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",  # fastapi.testclient
    "ruff>=0.6",
]

# Yeni CLI (src/cli; docs/design/02-services.md bölüm 4). Kurulum gerektirmeden: python -m src.cli.main
# `ssc` komutu için proje düzenlenebilir kipte kurulur: pip install -e .  (bağımlılıklar yine
# requirements.txt + constraints.txt ile kurulur). Düzenlenebilir olmayan kurulum desteklenmez: sürüm
# (pyproject.toml), çeviriler (locales/) ve web arayüzü (frontend/dist) proje klasöründen okunur.
[project.scripts]
ssc = "src.cli.main:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: gerçek SofaScore API'sine istek atar (ağ gerekir)",
    "browser: Playwright/Chrome başlatır",
]
addopts = "-m 'not live and not browser'"

# Kapsam `pytest --cov` ile ölçülür (CI: Linux / Python 3.14 işi); satır + dal kapsamı birlikte.
# main.py ve scripts/ ölçüme dahil değildir.
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# Taban, ölçülen değerin (2026-10-01: %54,1) hemen altındadır: kapsam yalnızca yukarı gidebilir.
# Test ekleyip değeri yükselttiğinizde tabanı da yükseltin.
fail_under = 53
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["frontend", "data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# B007 (kullanılmayan döngü değişkeni) ve B904 (except içinde from olmadan raise) kod tabanına
# yayılmış stil konuları; gerçek hata yakalayan kurallar açık kalır.
ignore = ["E501", "E402", "B007", "B904"]
