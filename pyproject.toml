[project]
name = "sofascore-scraper"
version = "2.0.0"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",  # fastapi.testclient
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: gerçek SofaScore API'sine istek atar (ağ gerekir)",
    "browser: Playwright/Chrome başlatır",
]
addopts = "-m 'not live and not browser'"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["frontend", "data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# B007 (kullanılmayan döngü değişkeni) ve B904 (except içinde from olmadan raise) kod tabanına
# yayılmış stil konuları; gerçek hata yakalayan kurallar açık kalır.
ignore = ["E501", "E402", "B007", "B904"]
